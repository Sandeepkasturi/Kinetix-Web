name: Kinetix — Build Mobile App

on:
  repository_dispatch:
    types: [build-apk]
  workflow_dispatch:
    inputs:
      appName:
        description: 'Application Name'
        required: true
        default: 'My App'
      appUrl:
        description: 'Website URL (https://...)'
        required: true
      buildId:
        description: 'Unique Build ID'
        required: true
      platform:
        description: 'Target platform (android or ios)'
        required: true
        default: 'android'
      enableDeepLinks:
        description: 'Enable deep linking (true/false)'
        required: false
        default: 'true'
      email:
        description: 'Email to notify when done'
        required: false
        default: ''
      baseUrl:
        description: 'Base URL for callbacks'
        required: false
        default: 'https://kinetixapp.com'

# ─── Concurrency: Cancel duplicate builds for same buildId ──────────────────
# This ensures we don't waste runner minutes on redundant requests
concurrency:
  group: build-${{ github.event.client_payload.buildId || inputs.buildId }}
  cancel-in-progress: true

jobs:
  # ═══════════════════════════════════════════════════════
  # Android Build
  # ═══════════════════════════════════════════════════════
  build-android:
    name: 'Android APK Build'
    runs-on: ubuntu-latest
    if: |
      (github.event.client_payload.platform || inputs.platform || 'android') == 'android'
    permissions:
      contents: read
      actions: write

    env:
      APP_NAME:          ${{ github.event.client_payload.appName        || inputs.appName }}
      APP_URL:           ${{ github.event.client_payload.appUrl         || inputs.appUrl }}
      BUILD_ID:          ${{ github.event.client_payload.buildId        || inputs.buildId }}
      BUILD_PLATFORM:    android
      ENABLE_DEEP_LINKS: ${{ github.event.client_payload.enableDeepLinks || inputs.enableDeepLinks || 'true' }}
      BUILD_EMAIL:       ${{ github.event.client_payload.email          || inputs.email }}
      BASE_URL:          ${{ github.event.client_payload.baseUrl        || inputs.baseUrl }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34 cmdline-tools;latest'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Install npm dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Download custom icon (if provided)
        env:
          ICON_PATH: ${{ github.event.client_payload.iconRepoPath }}
          GH_TOKEN:  ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$ICON_PATH" ]; then
            gh api "repos/${{ github.repository }}/contents/$ICON_PATH" --jq '.download_url' | xargs curl -fsSL -o icon.png
          fi

      - name: Run Kinetix build engine
        id: build_engine
        run: |
          npx tsx scripts/build-action.ts > build_output.log 2>&1
          cat build_output.log
          # Extract SHA-256 from log
          SHA=$(grep "::notice title=SHA256 Fingerprint::" build_output.log | cut -d':' -f4 | xargs || echo "NONE")
          echo "sha=$SHA" >> $GITHUB_OUTPUT

      - name: Upload APK
        id: upload_apk
        uses: actions/upload-artifact@v4
        with:
          name: app-release-${{ env.BUILD_ID }}
          path: android_project/app/build/outputs/apk/release/app-release-signed.apk
          retention-days: 7

      - name: Notify Success
        if: success()
        run: |
          curl -X POST "${{ env.BASE_URL }}/api/notify" \
            -H "Content-Type: application/json" \
            -d '{
              "buildId": "${{ env.BUILD_ID }}",
              "status": "success",
              "artifactId": "${{ steps.upload_apk.outputs.artifact-id }}",
              "sha256": "${{ steps.build_engine.outputs.sha }}",
              "appName": "${{ env.APP_NAME }}",
              "email": "${{ env.BUILD_EMAIL }}",
              "platform": "android"
            }'

      - name: Notify Failure
        if: failure()
        run: |
          curl -X POST "${{ env.BASE_URL }}/api/notify" \
            -H "Content-Type: application/json" \
            -d '{
              "buildId": "${{ env.BUILD_ID }}",
              "status": "failed",
              "appName": "${{ env.APP_NAME }}",
              "email": "${{ env.BUILD_EMAIL }}",
              "error": "Android build failed. Please check build logs for details."
            }'

      - name: Upload Logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-logs-android-${{ env.BUILD_ID }}
          path: |
            build_output.log
            android_project/app/build/reports/
          retention-days: 7

  # ═══════════════════════════════════════════════════════
  # iOS Build — Coming Soon
  # ═══════════════════════════════════════════════════════
  build-ios:
    name: 'iOS Build (Coming Soon)'
    runs-on: ubuntu-latest
    if: |
      (github.event.client_payload.platform || inputs.platform) == 'ios'
    permissions:
      contents: read
      actions: write

    env:
      BUILD_ID:          ${{ github.event.client_payload.buildId        || inputs.buildId }}
      BUILD_EMAIL:       ${{ github.event.client_payload.email          || inputs.email }}
      BASE_URL:          ${{ github.event.client_payload.baseUrl        || inputs.baseUrl }}
      APP_NAME:          ${{ github.event.client_payload.appName        || inputs.appName }}

    steps:
      - name: 🚧 iOS Build Coming Soon
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║                                                              ║"
          echo "║           🚀 iOS Build Coming Soon!                          ║"
          echo "║                                                              ║"
          echo "║   We are working on bringing iOS builds to GitHub Actions.  ║"
          echo "║   Stay tuned for updates!                                   ║"
          echo "║                                                              ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo ""

      - name: Notify User — Coming Soon
        run: |
          curl -X POST "${{ env.BASE_URL }}/api/notify" \
            -H "Content-Type: application/json" \
            -d '{
              "buildId": "${{ env.BUILD_ID }}",
              "status": "success",
              "appName": "${{ env.APP_NAME }}",
              "email": "${{ env.BUILD_EMAIL }}",
              "platform": "ios",
              "message": "iOS builds are coming soon! We are working on adding macOS runner support to GitHub Actions. Stay tuned for updates."
            }'
